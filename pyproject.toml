[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewrite-engine"
version = "0.1.0"
description = "Reescritura inteligente, natural y multilenguaje (motor híbrido offline, IA opcional)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mananpa Labs" }]
keywords = ["nlp", "paraphrase", "rewrite", "synonyms", "multilingual", "wordnet"]

# Núcleo ligero: el motor funciona solo con esto. Todo lo pesado es opcional
# y degrada con gracia (ver [project.optional-dependencies]).
dependencies = [
    "langdetect>=1.0.9",
    "wordfreq>=3.0.0",
    "simplemma>=1.0.0",
    "regex>=2023.0.0",
    "beautifulsoup4>=4.12.0",
    "rapidfuzz>=3.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# WordNet/OMW para sinónimos multilenguaje (datos se descargan con nltk).
wordnet = ["nltk>=3.8"]
# Servicio HTTP.
api = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
# Interfaz de línea de comandos.
cli = ["click>=8.1.0", "rich>=13.0.0"]
# Validación semántica con embeddings multilenguaje.
semantic = ["sentence-transformers>=2.5.0"]
# POS tagging / NER de calidad por idioma.
spacy = ["spacy>=3.7.0"]
# Corrección gramatical.
grammar = ["language-tool-python>=2.8"]
# Gancho de IA opcional vía API en la nube (NO se cablea en esta entrega).
ai = ["anthropic>=0.40.0"]
# Paráfrasis neuronal local (T5 ligero, HuggingFace) para el toggle de IA de la
# GUI/CLI. Corre 100% offline tras la primera descarga (caché de HuggingFace);
# no requiere servidor propio. Sólo aplica a texto en inglés (ver
# transformers/t5_paraphraser.py).
ai-paraphrase = ["transformers>=4.30.0", "torch>=2.0.0", "sentencepiece>=0.1.99"]
# App de escritorio (Tkinter es stdlib). pyspellchecker: corrector ortográfico.
# ttkthemes: tema visual "winxpblue" (azul XP-Luna, igual en cualquier versión
# de Windows). Aviso de licencia: ttkthemes es GPL-3.0-or-later (copyleft) —
# si distribuyes el .exe empaquetado con este tema, GPL obliga a poder
# entregar el código fuente completo a quien lo reciba. Sin este extra, la app
# usa los temas nativos vista/xpnative de Tcl/Tk (sin ninguna implicación).
desktop = ["pyspellchecker>=0.8.0", "ttkthemes>=3.2.2"]
# Para generar el ejecutable .exe.
build-exe = ["pyinstaller>=6.0"]
# Todo lo razonable de una vez (sin torch pesado de 'ai').
all = [
    "nltk>=3.8",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "sentence-transformers>=2.5.0",
    "spacy>=3.7.0",
    "language-tool-python>=2.8",
]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
rewrite-engine = "rewrite_engine.cli.main:main"

[project.gui-scripts]
rewrite-engine-gui = "rewrite_engine.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rewrite_engine"]

# Empaqueta los diccionarios JSON junto al código.
[tool.hatch.build.targets.wheel.force-include]
"data" = "rewrite_engine/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requiere dependencias opcionales pesadas (spacy, embeddings, etc.)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
